name: Deploy JOKER V4 Online

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract game files
        run: |
          unzip -q JOKER_V4_ONLINE_DEPLOY.zip -d extracted
          echo "PROJECT_DIR=extracted/JOKER_V4_2" >> $GITHUB_ENV

      - name: Apply online reliability fixes
        run: python "$GITHUB_WORKSPACE/.github/scripts/patch_online.py"

      - name: Install dependencies
        run: npm install
        working-directory: extracted/JOKER_V4_2

      - name: Test game and room logic
        run: npm test
        working-directory: extracted/JOKER_V4_2

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config wrangler.toml
        working-directory: extracted/JOKER_V4_2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
